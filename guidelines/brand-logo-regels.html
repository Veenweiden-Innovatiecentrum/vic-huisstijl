<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html, body { margin: 0; }
  body { padding: 16px 24px; background: var(--surface-page); font-family: var(--font-sans); display: grid; grid-template-columns: 1fr 1fr; gap: 8px 32px; align-content: center; }
  .rule { display: flex; align-items: baseline; gap: 10px; font-size: 14.5px; color: var(--vic-black); }
  .ok { color: var(--vic-green); font-weight: 900; }
  .no { color: var(--vic-red); font-weight: 900; }
</style>
</head>
<body>
<div class="rule"><span class="ok">✓</span> Gebruik zoveel mogelijk het basislogo</div>
<div class="rule"><span class="no">✗</span> Geen andere kleuren of kleurenschema's</div>
<div class="rule"><span class="ok">✓</span> In wit op donkerblauw of een donkere foto</div>
<div class="rule"><span class="no">✗</span> Niet vervormen in hoogte of breedte</div>
<div class="rule"><span class="ok">✓</span> In kleur op een lichte ondergrond</div>
<div class="rule"><span class="no">✗</span> Elementen niet los van elkaar verplaatsen</div>
<div class="rule"><span class="no">✗</span> Niet in wit op donkergroen</div>
<div class="rule"><span class="no">✗</span> Geen rand om het logo</div>
</body>
</html>
