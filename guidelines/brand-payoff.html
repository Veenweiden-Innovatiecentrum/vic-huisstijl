<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html, body { margin: 0; }
  body { padding: 16px; background: var(--surface-page); font-family: var(--font-sans); }
  .cover { position: relative; background: var(--vic-blue); border-radius: var(--radius-sm); height: 188px; overflow: hidden; display: flex; flex-direction: column; justify-content: center; padding: 0 36px; }
  .cover h1 { color: #fff; font-size: 26px; line-height: 1.2; letter-spacing: 0.02em; margin: 0; text-transform: uppercase; font-weight: 700; }
  .cover a { color: #fff; font-size: 13px; margin-top: 12px; text-decoration: underline; }
  .corner { position: absolute; right: 0; bottom: 0; width: 240px; height: 150px; background: #fff; clip-path: polygon(100% 0, 100% 100%, 0 100%); display: flex; align-items: flex-end; justify-content: flex-end; padding: 0 18px 14px 0; }
  .corner img { height: 78px; }
</style>
</head>
<body>
<div class="cover">
  <h1>Fris kijken,<br>dwars denken<br>en samenwerken</h1>
  <a href="https://www.veenweiden.nl">www.veenweiden.nl</a>
  <div class="corner"><img src="../assets/logo/VIC_Beeldmerk.png" alt="VIC beeldmerk"></div>
</div>
</body>
</html>
