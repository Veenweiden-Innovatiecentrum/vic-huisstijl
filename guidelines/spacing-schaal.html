<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing-schaal" subtitle="4px-basis, --space-1 t/m --space-9" -->
<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html, body { margin: 0; }
  body { padding: 18px 24px; background: var(--surface-page); font-family: var(--font-sans); }
  .scale { display: flex; align-items: flex-end; gap: 18px; }
  .step { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .bar { background: var(--vic-green); border-radius: 2px; width: 28px; }
  .step span { font-size: 12px; color: var(--text-muted); }
</style>
</head>
<body>
<div class="scale">
  <div class="step"><div class="bar" style="height: 4px;"></div><span>4</span></div>
  <div class="step"><div class="bar" style="height: 8px;"></div><span>8</span></div>
  <div class="step"><div class="bar" style="height: 12px;"></div><span>12</span></div>
  <div class="step"><div class="bar" style="height: 16px;"></div><span>16</span></div>
  <div class="step"><div class="bar" style="height: 24px;"></div><span>24</span></div>
  <div class="step"><div class="bar" style="height: 32px;"></div><span>32</span></div>
  <div class="step"><div class="bar" style="height: 48px;"></div><span>48</span></div>
  <div class="step"><div class="bar" style="height: 64px;"></div><span>64</span></div>
  <div class="step"><div class="bar" style="height: 96px;"></div><span>96</span></div>
</div>
</body>
</html>
