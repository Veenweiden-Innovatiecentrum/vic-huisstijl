<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html, body { margin: 0; }
  body { padding: 16px; background: var(--surface-page); display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .pane { border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; height: 148px; }
  .pane img { height: 64px; }
</style>
</head>
<body>
<div class="pane" style="border: 1px solid var(--vic-border);">
  <img src="../assets/logo/VIC_Basislogo.png" alt="VIC basislogo in kleur">
</div>
<div class="pane" style="background: var(--vic-blue);">
  <img src="../assets/logo/VIC_Basislogo.png" alt="VIC basislogo op donkerblauw" style="filter: brightness(0) invert(1);">
</div>
</body>
</html>
