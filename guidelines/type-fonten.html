<!-- @dsCard group="Type" viewport="700x150" name="Lettertypen" subtitle="Roboto (web/drukwerk) en Carlito als Calibri-vervanger" -->
<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html, body { margin: 0; }
  body { padding: 18px 24px; background: var(--surface-page); display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: center; }
  .name { font-size: 26px; margin: 0 0 4px; color: var(--vic-blue); }
  .weights { font-size: 16px; margin: 0 0 6px; color: var(--vic-black); }
  .meta { font-size: 12.5px; color: var(--text-muted); margin: 0; font-family: var(--font-sans); }
</style>
</head>
<body>
<div>
  <p class="name" style="font-family: var(--font-sans); font-weight: 700;">Roboto</p>
  <p class="weights" style="font-family: var(--font-sans);"><span style="font-weight:400">Regular</span> · <span style="font-weight:500">Medium</span> · <span style="font-weight:700">Bold</span> · <span style="font-weight:900">Black</span></p>
  <p class="meta">Flyers, brochures, web — via Google Fonts</p>
</div>
<div>
  <p class="name" style="font-family: var(--font-office); font-weight: 700;">Carlito</p>
  <p class="weights" style="font-family: var(--font-office);"><span style="font-weight:400">Regular</span> · <span style="font-weight:700">Bold</span></p>
  <p class="meta">Vervangt Calibri (kantoortoepassingen) op het web</p>
</div>
</body>
</html>
