<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html, body { margin: 0; }
  body { padding: 16px 24px; background: var(--surface-page); display: flex; align-items: center; gap: 28px; font-family: var(--font-sans); }
  .mark { height: 120px; }
  .avatar { width: 64px; height: 64px; border-radius: 50%; background: var(--vic-white); border: 1px solid var(--vic-border); display: flex; align-items: center; justify-content: center; }
  .avatar img { height: 40px; }
  p { font-size: 13.5px; color: var(--text-muted); max-width: 300px; margin: 0; line-height: 1.5; }
</style>
</head>
<body>
<img class="mark" src="../assets/logo/VIC_Beeldmerk.png" alt="VIC beeldmerk">
<div class="avatar"><img src="../assets/logo/VIC_Beeldmerk.png" alt=""></div>
<p>Gebruik zo min mogelijk; alleen waar een vierkant formaat vereist is (zoals social media-kanalen). Anders altijd het basislogo.</p>
</body>
</html>
